version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: catcham-api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - DATABASE_URL=file:/app/data/catcham.db
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-catcham_production_secure_access_secret_64chars_long_token}
      - JWT_ACCESS_TTL=15m
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-catcham_production_secure_refresh_secret_64chars_long_token}
      - JWT_REFRESH_TTL=7d
      - STORAGE_ROOT=/app/data/evidence
      - UPLOAD_MAX_BYTES=52428800
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=30
    volumes:
      - catcham_data:/app/data
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    container_name: catcham-web
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - api
    ports:
      - '3000:3000'

volumes:
  catcham_data:
    driver: local
